# ---------- 规则（整份替换） ----------
rules:
  - 'RULE-SET,private,DIRECT'
  - 'RULE-SET,private_ip,DIRECT,no-resolve'
  # ---- 让「电脑上的 Clash Verge」直接拨号，不被路由器二次代理 ----
  # 只放行机场节点所在域名；换机场时改这两行即可（当前机场：routely.moe / ykkcloud.link）
  - 'DOMAIN-SUFFIX,routely.moe,DIRECT'
  - 'DOMAIN-SUFFIX,ykkcloud.link,DIRECT'
  - 'RULE-SET,geolocation-cn,DIRECT'
  - 'RULE-SET,cn,DIRECT'
  - 'DOMAIN-SUFFIX,snssdk.com,DIRECT'
  - 'DOMAIN-SUFFIX,byteimg.com,DIRECT'
  - 'DOMAIN-SUFFIX,pstatp.com,DIRECT'
  - 'DOMAIN-SUFFIX,douyinvod.com,DIRECT'
  - 'RULE-SET,games_cn,DIRECT'
  - 'RULE-SET,games_download_cn,DIRECT'
  - 'RULE-SET,synology,DIRECT'
  - 'RULE-SET,nvidia_cn,DIRECT'
  - 'RULE-SET,apple_cn,DIRECT'
  - 'RULE-SET,microsoft_cn,DIRECT'
  - 'DOMAIN,international-gfe.download.nvidia.com,DIRECT'

  - 'RULE-SET,ai,AI'
  - 'RULE-SET,tiktok,TikTok'
  - 'RULE-SET,tiktok_ip,TikTok,no-resolve'
  - 'RULE-SET,meta,Meta'
  - 'RULE-SET,facebook_ip,Meta,no-resolve'
  - 'RULE-SET,cryptocurrency,Crypto'

  - 'RULE-SET,geolocation-!cn,默认代理'
  - 'RULE-SET,cn_ip,DIRECT,no-resolve'
  - 'MATCH,漏网之鱼'
