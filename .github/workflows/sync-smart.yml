name: Sync MyClash with Smart

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync and patch upstream script
        run: |
          python3 - <<'PY'
          import urllib.request
          import pathlib
          import re

          UPSTREAM = "https://raw.githubusercontent.com/AIsouler/MyClash/main/Script/mihomoScript.js"

          # 本仓库自己的文件头：覆盖上游头部注释，同时保留署名与改编声明。
          HEADER_LINES = [
              "/**",
              " * mihomo 配置覆写脚本（Smart 智能选点版）",
              " * 作者：onmiui",
              " * 仓库：https://github.com/onmiui/SmartScript",
              " * 脚本链接：https://raw.githubusercontent.com/onmiui/SmartScript/main/SmartScript.js",
              " *",
              " * 本脚本由 AIsouler/MyClash 的上游脚本自动同步并改写而来：",
              " * https://github.com/AIsouler/MyClash",
              " * 主要改动：将 url-test 策略组替换为 smart 类型，并把「自动选择」相关命名",
              " * 统一改为「Smart智能选点」。原始实现与版权归原作者 AIsouler 所有。",
              " */",
          ]
          HEADER = "\n".join(HEADER_LINES) + "\n"

          # 默认关闭的分流开关；想恢复某个开关的默认值，把它从列表里删掉即可。
          DISABLED_OPTIONS = [
              "YouTube",
              "Microsoft",
              "Apple",
              "Twitter",
              "Line",
              "Netflix",
              "Emby",
              "PikPak",
              "Spotify",
              "PayPal",
              "Patreon",
              "EHentai",
              "AdBlock",
          ]

          req = urllib.request.Request(UPSTREAM, headers={"User-Agent": "GitHub-Actions"})
          content = urllib.request.urlopen(req).read().decode("utf-8")

          # 1) 重写文件头。
          content, header_count = re.subn(
              r"\A(?:\ufeff)?\s*/\*\*.*?\*/[ \t]*\r?\n",
              lambda _m: HEADER,
              content,
              count=1,
              flags=re.S,
          )
          if header_count != 1:
              raise RuntimeError("未找到文件头注释块，停止更新")

          # 2) 原地将自动选择策略组改为 Smart，不新增代理组。
          pattern = re.compile(
              r"(const urlTestBaseOption\s*=\s*\{\s*"
              r"\.\.\.groupBaseOption,\s*"
              r"type:\s*)['\"]url-test['\"]"
              r"([,]\s*\n)"
              r"(\s*tolerance:\s*[^,\n]+,\s*\n)?"
          )
          content, count = pattern.subn(r"\1'smart'\2", content, count=1)

          if count == 0:
              smart_pattern = re.compile(
                  r"(const urlTestBaseOption\s*=\s*\{\s*"
                  r"\.\.\.groupBaseOption,\s*"
                  r"type:\s*['\"]smart['\"],\s*\n)"
                  r"\s*tolerance:\s*[^,\n]+,\s*\n"
              )
              content, removed = smart_pattern.subn(r"\1", content, count=1)
              if removed != 1:
                  # 上游已是干净的 Smart 配置时允许继续同步。
                  if not re.search(
                      r"const urlTestBaseOption\s*=\s*\{\s*"
                      r"\.\.\.groupBaseOption,\s*"
                      r"type:\s*['\"]smart['\"]",
                      content
                  ):
                      raise RuntimeError("未找到预期的 urlTestBaseOption 配置，停止更新")

          # 3) 将基础组、极简模式组及其引用改为新名称。
          # 将启用开关名称同步为 Smart智能选点，确保默认代理组能正确引用基础组。
          content, option_count = re.subn(
              r"自动选择(?=:\s*true)",
              "Smart智能选点",
              content,
              count=1
          )
          if option_count != 1:
              raise RuntimeError("未找到自动选择开关定义，停止更新")
          content = content.replace(
              "ruleOptionsEnable.自动选择",
              "ruleOptionsEnable.Smart智能选点"
          )
          # 地区自动选择组名称同步改为“地区-Smart智能选点”。
          content, region_count = re.subn(
              r"\$\{name\}-自动选择",
              "${name}-Smart智能选点",
              content
          )
          if region_count < 1:
              raise RuntimeError("未找到地区自动选择组名称模板，停止更新")
          content, group_count = re.subn(
              r"name:\s*(['\"])自动选择\1",
              "name: 'Smart智能选点'",
              content
          )
          content, ref_count = re.subn(
              r"\[\s*(['\"])自动选择\1\s*\]",
              "['Smart智能选点']",
              content
          )
          if group_count < 2 or ref_count < 1:
              raise RuntimeError(
                  f"自动选择组名称替换数量异常：groups={group_count}, refs={ref_count}"
              )

          # 4) 默认关闭指定的分流开关。
          for key in DISABLED_OPTIONS:
              content, changed = re.subn(
                  rf"(?m)^([ \t]*{re.escape(key)}:[ \t]*)true\b",
                  r"\1false",
                  content,
                  count=1,
              )
              if changed == 0 and not re.search(
                  rf"(?m)^[ \t]*{re.escape(key)}:[ \t]*false\b",
                  content
              ):
                  raise RuntimeError(f"未找到 {key} 开关，停止更新")

          path = pathlib.Path("SmartScript.js")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(content, encoding="utf-8")
          print(f"同步完成：Smart 类型、Smart智能选点名称、{len(DISABLED_OPTIONS)} 个默认关闭开关已应用")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SmartScript.js

          if git diff --cached --quiet; then
            echo "没有新更新"
            exit 0
          fi

          git commit -m "Sync upstream MyClash with Smart"
          git push
